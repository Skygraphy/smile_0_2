name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smile-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smile-app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  smile-frame:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smile-frame
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  supabase-functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check **/*.ts
      - run: deno test --allow-net --allow-env

  media-processing-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: media-processing-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm test
