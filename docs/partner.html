<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" href="favicon.png">
<title>Smile Gutscheine</title>
<meta name="theme-color" content="#0E0C0C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* A partner's view of their voucher cards (2026-11-11): the secret token
   after the # never reaches any server log. Only redeemed / open, no
   names, no photos. */
:root { color-scheme: dark; --bg: #0E0C0C; --surface: #1A1716; --surface2: #24201F; --line: #332D2B; --fg: #F2EEEC; --muted: #B5ACA9; --dim: #7D7472;
  --coral: #FF6F61; --green: #5BC48A; --green-soft: rgba(91,196,138,.14);
  --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.5; padding-inline: 16px; padding-block: 0 56px; }
main { max-width: 680px; margin: 0 auto; }
header { display: flex; align-items: center; gap: 12px; padding-block: 24px; }
.logo { width: 34px; height: 34px; border-radius: 10px; background: var(--coral); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 21px; }
.word { font-weight: 700; font-size: 23px; } .word b { color: var(--coral); font-weight: 700; }
h1 { font-size: 26px; font-weight: 800; margin: 6px 0 4px; text-wrap: balance; }
.sub { color: var(--muted); margin: 0 0 18px; }
.bar { height: 10px; border-radius: 5px; background: var(--surface2); overflow: hidden; margin: 6px 0 20px; }
.bar i { display: block; height: 100%; background: var(--green); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
table { width: 100%; border-collapse: collapse; font-size: 14.5px; font-variant-numeric: tabular-nums; }
th { text-align: left; color: var(--dim); font-weight: 600; font-size: 12.5px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
td { padding: 10px 16px; border-bottom: 1px solid var(--line); }
tr:last-child td { border-bottom: 0; }
td.m { color: var(--muted); }
.pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 99px; background: var(--surface2); color: var(--muted); }
.pill.ok { background: var(--green-soft); color: var(--green); }
.small { font-size: 13px; color: var(--muted); margin-top: 14px; }
.hidden { display: none; }
</style>
</head>
<body>
<main>
  <header><span class="logo" aria-hidden="true">S</span><span class="word">S<b>m</b>ile</span></header>
  <div id="view" class="hidden">
    <h1 id="name"></h1>
    <p class="sub" id="summary"></p>
    <div class="bar"><i id="bar"></i></div>
    <div class="card"><table>
      <thead><tr><th id="h-card"></th><th id="h-status"></th><th id="h-date"></th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
    <p class="small" id="foot"></p>
  </div>
  <p id="missing" class="sub hidden"></p>
</main>
<script>
  const LANG = (navigator.language || 'de').toLowerCase().startsWith('de') ? 'de' : 'en';
  const T = {
    de: {
      summary: (r, n, f, m) => `${r} von ${n} Karten eingelöst · ${f} Frame${f > 1 ? 's' : ''} für ${m} ${m === 1 ? 'Monat' : 'Monate'}`,
      card: 'Karte', status: 'Status', date: 'Eingelöst am', redeemed: 'eingelöst', open: 'offen', blocked: 'gesperrt',
      foot: (d) => `Offene Karten sind einlösbar bis ${d}. Namen und Fotos der Familien sind hier nie zu sehen.`,
      missing: 'Diesen Link gibt es nicht. Bitte prüfe ihn oder frag bei Smile nach.', locale: 'de-AT',
    },
    en: {
      summary: (r, n, f, m) => `${r} of ${n} cards redeemed · ${f} Frame${f > 1 ? 's' : ''} for ${m} ${m === 1 ? 'month' : 'months'}`,
      card: 'Card', status: 'Status', date: 'Redeemed on', redeemed: 'redeemed', open: 'open', blocked: 'blocked',
      foot: (d) => `Open cards can be redeemed until ${d}. Families' names and photos are never shown here.`,
      missing: "This link doesn't exist. Please check it or ask Smile.", locale: 'en-GB',
    },
  }[LANG];
  document.documentElement.lang = LANG;
  const $ = (id) => document.getElementById(id);
  const date = (iso) => new Date(iso).toLocaleDateString(T.locale, { day: 'numeric', month: 'long', year: 'numeric' });
  const token = location.hash.slice(1);
  const fail = () => { $('missing').textContent = T.missing; $('missing').classList.remove('hidden'); };
  if (!token) fail();
  else fetch('https://wxuipqaozvgzthlgnbgz.supabase.co/functions/v1/voucher-partner', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token }),
  }).then((r) => r.ok ? r.json() : Promise.reject()).then((d) => {
    const redeemed = d.cards.filter((c) => c.redeemed_at).length;
    $('name').textContent = d.name;
    $('summary').textContent = T.summary(redeemed, d.cards.length, d.frames, d.months);
    $('bar').style.width = (d.cards.length ? (100 * redeemed / d.cards.length) : 0) + '%';
    $('h-card').textContent = T.card; $('h-status').textContent = T.status; $('h-date').textContent = T.date;
    for (const c of d.cards) {
      const tr = document.createElement('tr');
      tr.innerHTML = '<td></td><td><span class="pill"></span></td><td class="m"></td>';
      tr.children[0].textContent = '…-' + c.last4;
      const pill = tr.querySelector('.pill');
      pill.textContent = c.redeemed_at ? T.redeemed : (c.blocked || d.blocked) ? T.blocked : T.open;
      if (c.redeemed_at) pill.classList.add('ok');
      tr.children[2].textContent = c.redeemed_at ? date(c.redeemed_at) : '–';
      $('rows').append(tr);
    }
    $('foot').textContent = T.foot(date(d.redeem_until));
    $('view').classList.remove('hidden');
  }).catch(fail);
</script>
</body>
</html>
