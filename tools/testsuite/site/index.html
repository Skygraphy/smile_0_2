<title>Smile Tutorial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: chapter rail on the left (a strip on phones), the chapter's steps as rows of phone screenshot + text + verdict on the right; Smile's own dark look, coral as the one accent. */
:root{
  color-scheme:dark;
  --bg:#121212; --surface:#1b1918; --raised:#252221; --line:#332d2b;
  --fg:#ececec; --muted:#a8a09d; --accent:#FF6F61; --on-accent:#1f0f0d;
  --ok:#6cc58f; --ok-bg:#1d2e24; --bad:#ff8a7a; --bad-bg:#3a201c; --open:#8f8885;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);margin:0;padding-inline:16px;padding-block:20px 64px;font-size:15px;line-height:1.5}
.app{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:820px){.app{grid-template-columns:minmax(0,1fr)}}
header.top{max-width:1180px;margin:0 auto 22px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
.word{font-weight:700;font-size:26px;letter-spacing:-.01em}.word i{font-style:normal;color:var(--accent)}
header.top .sub{color:var(--muted);font-size:14px}
nav.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:grid;gap:6px}
@media (max-width:820px){nav.rail{position:static;grid-auto-flow:column;grid-auto-columns:minmax(200px,1fr);overflow-x:auto;padding-bottom:4px}}
.rail button{all:unset;cursor:pointer;display:grid;gap:4px;padding:12px 14px;border-radius:12px;background:var(--surface)}
.rail button:focus-visible{outline:2px solid var(--accent)}
.rail button[aria-current="true"]{background:var(--raised);box-shadow:inset 3px 0 0 var(--accent)}
.rail .t{font-weight:600;font-size:14.5px}
.rail .meta{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;display:flex}
.bar span{display:block;height:100%}
.bar .o{background:var(--ok)}.bar .b{background:var(--bad)}
main{display:grid;gap:22px;min-width:0}
.intro{display:grid;gap:6px}
.intro h1{margin:0;font-size:24px;text-wrap:balance}
.intro p{margin:0;color:var(--muted);max-width:68ch}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--raised);color:var(--muted);font-variant-numeric:tabular-nums}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.bad{background:var(--bad-bg);color:var(--bad)}
.step{display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px;padding:18px;border-radius:16px;background:var(--surface)}
@media (max-width:560px){.step{grid-template-columns:minmax(0,1fr)}.shot{max-width:240px}}
.shot{width:100%;border-radius:14px;border:1px solid var(--line);cursor:zoom-in;display:block;background:#000}
.body{display:grid;gap:10px;align-content:start;min-width:0}
.head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.no{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
.head h2{margin:0;font-size:17px}
.dev{margin-left:auto;font-size:12px;color:var(--muted)}
.lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0}
.txt{margin:0;max-width:62ch}
.checks{display:grid;gap:4px;font-size:13px}
.checks div{display:flex;gap:8px;align-items:baseline}
.dot{width:8px;height:8px;border-radius:50%;flex:none;transform:translateY(-1px)}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}
.verdict{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-top:4px}
.verdict button{font:inherit;font-size:14px;font-weight:600;border-radius:999px;padding:8px 18px;cursor:pointer;border:1px solid var(--line);background:var(--raised);color:var(--fg)}
.verdict button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.verdict button.ok[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#0e1a12}
.verdict button.bad[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#2a0d09}
.verdict .state{font-size:12.5px;color:var(--muted)}
textarea{width:100%;min-height:64px;resize:vertical;font:inherit;font-size:14px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
textarea:focus{outline:2px solid var(--accent);border-color:transparent}
.save{font-size:13px;font-weight:600;border-radius:999px;padding:6px 14px;cursor:pointer;border:0;background:var(--accent);color:var(--on-accent)}
.finds{display:grid;gap:8px}
.find{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:12px 14px;border-radius:12px;background:var(--surface)}
.find .n{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
.find p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.empty{color:var(--muted);padding:24px;border-radius:16px;background:var(--surface)}
.ver{display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:12px;background:var(--surface);font-size:13px;color:var(--muted)}
.ver select{flex:1;font:inherit;font-size:14px;font-weight:600;color:var(--fg);background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.vers{display:grid;gap:12px}
.vcard{background:var(--surface);border-radius:14px;padding:14px 16px;display:grid;gap:8px}
.vcard h2{margin:0;font-size:17px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.vcard .meta{font-size:12.5px;font-weight:400;color:var(--muted)}
.vcard p{margin:0;color:var(--muted);font-size:14px;line-height:1.5;max-width:70ch}
.vcard ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px;line-height:1.45}
.old{background:#2c2a20;color:#e6c76a;border-radius:10px;padding:8px 12px;font-size:13px}
.status{max-width:1180px;margin:0 auto 22px;border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface)}
.status[hidden]{display:none}
.status .dot2{width:12px;height:12px;border-radius:50%}
.status.work .dot2{background:#e6c76a;box-shadow:0 0 0 0 #e6c76a88}
.status.you .dot2{background:var(--ok)}
.status.work{box-shadow:inset 3px 0 0 #e6c76a}.status.you{box-shadow:inset 3px 0 0 var(--ok)}
.status .what{font-weight:600;font-size:15px}
.status .more{color:var(--muted);font-size:13px;margin-top:2px;line-height:1.45}
.status .go{font:inherit;font-size:13.5px;font-weight:600;border:0;border-radius:999px;padding:8px 16px;background:var(--accent);color:var(--on-accent);cursor:pointer;white-space:nowrap}
@media (max-width:560px){.status{grid-template-columns:auto minmax(0,1fr)}.status .go{grid-column:1/-1}}
@media (prefers-reduced-motion:no-preference){.status.work .dot2{animation:pulse 1.6s infinite}}
@keyframes pulse{0%{box-shadow:0 0 0 0 #e6c76a88}70%{box-shadow:0 0 0 10px #e6c76a00}100%{box-shadow:0 0 0 0 #e6c76a00}}
.why{background:var(--bg);border-radius:10px;padding:8px 10px}
.why .txt{font-size:13.5px;color:#cfc7c4}
.step.open{box-shadow:inset 3px 0 0 var(--accent)}
.step.changed,.step.branch.changed{box-shadow:inset 3px 0 0 #e6c76a}
.step.changed .verdict .state{color:#e6c76a}
.ctx{font-size:13px;color:var(--muted)}
.ctx summary{cursor:pointer}
.ctx ul{margin:6px 0 0;padding-left:18px;display:grid;gap:2px;font-variant-numeric:tabular-nums}
.cl{flex-basis:100%;border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.45}
.cl.ok{background:#1f2430;color:#a9c4f5}
.cl.ask{background:#3a2a10;color:#f2c879}
.step.asked,.step.branch.asked{box-shadow:inset 3px 0 0 #f2a03d}
.step.branch.open{box-shadow:inset 3px 0 0 var(--accent)}
.kind{font-size:11px;font-weight:600;letter-spacing:.04em;padding:2px 8px;border-radius:999px;background:var(--raised);color:var(--muted)}
.kind.branch{background:#2a2433;color:#c4a8f0}
.step.branch{box-shadow:inset 3px 0 0 #6d55a0}
.cov{display:grid;gap:14px}
.cov section{background:var(--surface);border-radius:14px;padding:14px 16px;display:grid;gap:8px}
.cov h2{margin:0;font-size:15.5px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.cov h2 .meta{font-size:12.5px;font-weight:400;color:var(--muted)}
.cov ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.cov li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:baseline;font-size:14px;padding:3px 0;border-top:1px solid var(--line)}
.cov li:first-child{border-top:0}
.cov li .l{min-width:0;overflow-wrap:anywhere}
.chip.later{background:#2c2a20;color:#e6c76a}
.note-off{color:var(--muted);font-size:12.5px}
dialog{border:0;padding:0;background:transparent;max-width:min(92vw,520px)}
dialog::backdrop{background:rgba(0,0,0,.8)}
dialog img{width:100%;border-radius:16px;display:block}
@media (prefers-reduced-motion:no-preference){.rail button,.verdict button{transition:background .15s}}
</style>

<header class="top">
  <div class="word">S<i>m</i>ile Tutorial</div>
  <div class="sub">Jeder Schritt wurde auf echten Geräten mit erfundenen Daten durchgespielt. Bitte pro Schritt bestätigen.</div>
</header>
<section class="status" id="status" aria-live="polite"></section>
<div class="app">
  <nav class="rail" id="rail" aria-label="Kapitel"></nav>
  <main id="main"><div class="empty">Kapitel werden geladen …</div></main>
</div>
<dialog id="zoom"><img id="zoomImg" alt=""></dialog>

<script>
const state = { index: null, chapters: {}, reviews: {}, current: null, db: null, canWrite: true };
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// A review belongs to a step by its title: numbers shift when steps are added.
const slug = t => String(t).toLowerCase().replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss")
  .replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const key = (ch, step) => `${ch}--${slug(step.title)}`;

// Every app version has its own tutorial (v/<version>/chNN); the newest is shown first.
async function setVersion(version) {
  const v = state.index.versions.find(x => x.version === version) ?? state.index.versions[0];
  state.version = v.version;
  state.index.chapters = v.chapters;
  state.chapters = {};
  for (const c of v.chapters) state.chapters[c.id] = await (await fetch(`v/${v.version}/${c.id}/steps.json`)).json();
  try { localStorage.setItem("version", v.version); } catch {}
}
const newest = () => state.index.versions[0]?.version;

async function load() {
  try {
    state.index = await (await fetch("data/index.json")).json();
    state.coverage = await (await fetch("data/coverage.json")).json();
    let savedVersion = null;
    try { savedVersion = localStorage.getItem("version"); } catch {}
    await setVersion(savedVersion);
  } catch (e) {
    $("#main").innerHTML = '<div class="empty">Die Kapitel konnten nicht geladen werden. Bitte die Seite neu laden.</div>';
    return;
  }
  let saved = null;
  try { saved = localStorage.getItem("chapter"); } catch {}
  state.current = state.chapters[saved] || ["finds", "coverage", "versions"].includes(saved) ? saved : state.index.chapters[0]?.id;
  render();
  connectDb();
}

async function connectDb() {
  const db = await window.claude?.use?.("db");
  if (!db) { state.canWrite = false; render(); return; }
  state.db = db;
  db.collection("reviews").onSnapshot(snap => {
    state.reviews = {};
    for (const d of snap.docs) state.reviews[d.id] = d.data();
    renderRail(); renderVerdicts(); renderStatus();
  }, () => { state.canWrite = false; render(); });
  // What is going on right now: written by Claude at every stage.
  db.doc("status/now").onSnapshot(snap => { state.status = snap.exists ? snap.data() : null; renderStatus(); }, () => {});
}

// A verdict counts only for what was seen: same texts, nearly the same
// screenshot (difference hash, up to 16 of 256 bits). Otherwise the step is
// "geaendert" and waits for a new look.
const SAME_PICTURE = 16;
function hamming(a, b) {
  let d = 0;
  for (let i = 0; i < Math.min(a.length, b.length); i++) {
    let x = parseInt(a[i], 16) ^ parseInt(b[i], 16);
    while (x) { d += x & 1; x >>= 1; }
  }
  return d + Math.abs(a.length - b.length) * 4;
}
// Claude goes through every new version first: what he is sure of he
// confirms himself (by "claude", with a reason), where he is unsure he asks
// (verdict "ask", with a question). Ernst's own verdict always wins.
function verdictOf(ch, step) {
  const r = state.reviews[key(ch, step)];
  if (!r?.verdict) return { state: "offen", r };
  const same = r.textHash === step.textHash && r.imgHash && step.imgHash && hamming(r.imgHash, step.imgHash) <= SAME_PICTURE
    && r.ctxHash && r.ctxHash === step.ctxHash;
  if (!same) {
    const why = [];
    if (!r.imgHash || !r.ctxHash) why.push("noch ohne Bild- und Zustandsvergleich bestätigt");
    else {
      if (r.textHash !== step.textHash) why.push("Text des Schritts geändert");
      if (hamming(r.imgHash, step.imgHash) > SAME_PICTURE) why.push("Bildschirm sieht anders aus");
      if (r.ctxHash !== step.ctxHash) why.push(...stateDiff([r.stateBefore, r.stateAfter], [step.stateBefore, step.stateAfter]).slice(0, 6).map(d => "Zustand: " + d));
    }
    return { state: "geaendert", r, why };
  }
  if (r.verdict === "ask") return { state: "frage", r };
  if (r.by === "claude" && r.verdict === "ok") return { state: "claude", r };
  return { state: r.verdict, r };
}
const DONE = ["ok", "no", "claude"];

// What differs between two states, in words (leaf by leaf).
const LABELS = { rows: "Einträge", files: "Dateien", people: "Personen", server: "Server", handy: "Handy",
  name: "Name", smileName: "Smile-Name", picture: "Profilbild", angemeldet: "angemeldet" };
function stateDiff(a, b) {
  const out = [];
  const show = v => v === true ? "ja" : v === false ? "nein" : v == null || v === "" ? "nichts" : String(v);
  const walk = (x, y, path) => {
    if (x && y && typeof x === "object" && typeof y === "object") {
      for (const k of new Set([...Object.keys(x), ...Object.keys(y)])) walk(x[k], y[k], [...path, k]);
    } else if (JSON.stringify(x) !== JSON.stringify(y)) {
      out.push(path.map(k => LABELS[k] ?? k).join(" › ") + ": " + show(typeof x === "object" ? JSON.stringify(x) : x) + " → " + show(typeof y === "object" ? JSON.stringify(y) : y));
    }
  };
  walk(a ?? {}, b ?? {}, []);
  return out;
}

function openSteps() {
  const out = [];
  for (const c of state.index?.chapters ?? []) for (const s of state.chapters[c.id]?.steps ?? []) {
    if (!DONE.includes(verdictOf(c.id, s).state)) out.push({ ch: c.id, no: s.no });
  }
  return out;
}

function renderStatus() {
  const el = $("#status"), st = state.status;
  if (!st) { el.hidden = true; return; }
  el.hidden = false;
  const open = openSteps();
  const working = st.phase === "arbeitet";
  el.className = "status " + (working ? "work" : "you");
  const when = st.at ? new Date(st.at).toLocaleString("de-AT", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "";
  const youText = open.length
    ? `${open.length} ${open.length === 1 ? "Schritt wartet" : "Schritte warten"} auf dich. Alles andere hat Claude schon geprüft.`
    : "Alles bestätigt. Danke!";
  el.innerHTML = `<span class="dot2"></span>
    <div><div class="what">${esc(working ? "Claude arbeitet gerade" : "Du bist dran")}: ${esc(st.message ?? "")}</div>
      <div class="more">${working ? esc(st.detail ?? "Bitte warten, die Seite meldet sich, sobald etwas für dich bereit ist.") : esc(youText)}
        Die Seite aktualisiert sich selbst, du musst nichts neu laden.${when ? " Stand: " + esc(when) + "." : ""}</div></div>
    ${!working && open.length ? `<button class="go">Zum ersten offenen Schritt</button>` : ""}`;
  el.querySelector(".go")?.addEventListener("click", () => {
    const first = open[0];
    state.current = first.ch; render();
    requestAnimationFrame(() => document.getElementById("s" + first.no)?.scrollIntoView({ behavior: "smooth", block: "start" }));
  });
}

function counts(ch) {
  const steps = state.chapters[ch]?.steps ?? [];
  let ok = 0, bad = 0;
  for (const s of steps) { const v = verdictOf(ch, s).state; if (v === "ok" || v === "claude") ok++; else if (v === "no") bad++; }
  return { total: steps.length, ok, bad };
}

function renderRail() {
  const rail = $("#rail");
  const versions = state.index.versions;
  rail.innerHTML = `<label class="ver"><span>Version</span>
      <select id="ver">${versions.map(v => `<option value="${esc(v.version)}"${v.version === state.version ? " selected" : ""}>${esc(v.version)}${v.version === newest() ? " (aktuell)" : ""}</option>`).join("")}</select></label>` +
    state.index.chapters.map(c => {
    const { total, ok, bad } = counts(c.id);
    const pct = n => total ? (n / total * 100).toFixed(1) : 0;
    return `<button data-ch="${c.id}" aria-current="${c.id === state.current}">
      <span class="t">${esc(c.no)}. ${esc(c.title)}</span>
      <span class="meta">${ok} von ${total} bestätigt${bad ? ` · ${bad} passt nicht` : ""}</span>
      <span class="bar"><span class="o" style="width:${pct(ok)}%"></span><span class="b" style="width:${pct(bad)}%"></span></span>
    </button>`;
  }).join("") + `<button data-ch="coverage" aria-current="${state.current === "coverage"}">
      <span class="t">Abdeckung</span><span class="meta">${state.coverage.tested} geprüft · ${state.coverage.later} später · ${state.coverage.open} offen</span>
      <span class="bar"><span class="o" style="width:${(state.coverage.tested / Math.max(1, state.coverage.tested + state.coverage.later + state.coverage.open) * 100).toFixed(1)}%"></span></span></button>
    <button data-ch="finds" aria-current="${state.current === "finds"}">
      <span class="t">Funde</span><span class="meta">${state.index.findings.length} gefunden · ${state.index.findings.filter(f => f.status === "behoben").length} behoben</span></button>
    <button data-ch="versions" aria-current="${state.current === "versions"}">
      <span class="t">Versionen</span><span class="meta">${versions.length} ${versions.length === 1 ? "Version" : "Versionen"} · aktuell ${esc(newest())}</span></button>`;
  $("#ver").onchange = async e => {
    await setVersion(e.target.value);
    if (!state.chapters[state.current] && !["finds", "coverage", "versions"].includes(state.current)) state.current = state.index.chapters[0]?.id;
    render();
  };
  rail.querySelectorAll("button").forEach(b => b.onclick = () => {
    state.current = b.dataset.ch;
    try { localStorage.setItem("chapter", state.current); } catch {}
    render(); window.scrollTo({ top: 0 });
  });
}

function renderFinds() {
  const f = state.index.findings;
  $("#main").innerHTML = `<section class="intro"><h1>Funde</h1>
    <p>Alles, was beim Durchspielen aufgefallen ist. Behobene Funde sind in der Test-App schon korrigiert und werden beim nächsten Lauf mitgeprüft.</p></section>
    <div class="finds">${f.map(x => `<div class="find"><span class="n">${x.no}</span>
      <div><strong>${esc(x.title)}</strong><p>${esc(x.detail)}</p></div>
      <span class="chip ${x.status === "behoben" ? "ok" : "bad"}">${esc(x.status)}${x.version ? " in " + esc(x.version) : ""}</span></div>`).join("")}</div>`;
}

// What changed in each version (from CHANGELOG.md).
function renderVersions() {
  const md = t => esc(t).split("\n").map(l => l.startsWith("- ") ? `<li>${l.slice(2)}</li>` : l.trim() ? `<p>${l}</p>` : "").join("")
    .replace(/(<li>.*?<\/li>)+/gs, m => `<ul>${m}</ul>`);
  $("#main").innerHTML = `<section class="intro"><h1>Versionen</h1>
    <p>Jede Version, die du testest, hat eine eigene Nummer, ein eigenes Tutorial und einen festen Stand im Code. Oben links kannst du ältere Tutorials ansehen.</p></section>
    <div class="vers">${state.index.versions.map(v => `<section class="vcard"><h2>${esc(v.version)}${v.version === newest() ? ' <span class="chip ok">aktuell</span>' : ""}<span class="meta">${esc(v.date)} · ${v.chapters.length} ${v.chapters.length === 1 ? "Kapitel" : "Kapitel"}</span></h2>${md(v.changelog)}</section>`).join("")}</div>`;
}

function chapterName(id) {
  const c = state.index.chapters.find(x => x.id === id);
  return c ? `Kapitel ${c.no}` : `Kapitel ${+id.slice(2)}`;
}

function renderCoverage() {
  const c = state.coverage;
  const chip = e => e.status === "geprüft"
    ? `<span class="chip ok">geprüft · ${e.where.map(chapterName).join(", ")}</span>`
    : e.status === "später" ? `<span class="chip later">folgt in ${e.where.map(chapterName).join(", ")}</span>`
    : `<span class="chip bad">noch nicht geprüft</span>`;
  $("#main").innerHTML = `<section class="intro"><h1>Abdeckung</h1>
    <p>Jeder Knopf und jedes Feld, das auf einer Seite angetippt werden kann, und wo es geprüft wird. Rot ist noch nirgends geprüft. Am Ende darf hier nichts Rotes mehr stehen.</p>
    <div class="chips"><span class="chip ok">${c.tested} geprüft</span><span class="chip later">${c.later} folgen später</span><span class="chip ${c.open ? "bad" : "ok"}">${c.open} noch nicht geprüft</span></div></section>
    <div class="cov">${c.screens.map(s => {
      const o = s.elements.filter(e => e.status === "offen").length;
      return `<section><h2>${esc(s.screen)}<span class="meta">${s.elements.length} Elemente${o ? ` · ${o} offen` : ""}</span></h2>
        <ul>${s.elements.map(e => `<li><span class="l">${esc(e.label)}</span>${chip(e)}</li>`).join("")}</ul></section>`;
    }).join("")}</div>`;
}

function renderChapter() {
  const ch = state.chapters[state.current];
  const autoOk = ch.steps.flatMap(s => s.checks).filter(c => c.ok).length;
  const autoAll = ch.steps.flatMap(s => s.checks).length;
  $("#main").innerHTML = `<section class="intro">
      <h1>${esc(ch.no ?? "")}${ch.no ? ". " : ""}${esc(ch.title)}</h1>
      <p>${esc(ch.intro)}</p>
      <div class="chips"><span class="chip ${autoOk === autoAll ? "ok" : "bad"}">${autoOk} von ${autoAll} automatischen Prüfungen bestanden</span>
      <span class="chip">Version ${esc(state.version)}</span><span class="chip">Lauf vom ${esc(ch.ranAt ?? "")}</span></div>
      ${state.canWrite ? "" : '<p class="note-off">Bestätigen ist in dieser Ansicht nicht möglich.</p>'}
      ${state.version !== newest() ? `<p class="old">Das ist das Tutorial der älteren Version ${esc(state.version)}, nur zum Ansehen. Bestätigt wird in der aktuellen Version ${esc(newest())}.</p>` : ""}
    </section>
    ${ch.steps.map(s => `<article class="step${s.kind === "Abzweigung" ? " branch" : ""}${DONE.includes(verdictOf(ch.id, s).state) ? "" : " open"}" id="s${s.no}">
      <img class="shot" src="v/${state.version}/${ch.id}/${s.image.replace(".png", ".jpg")}" alt="Bildschirm nach Schritt ${s.no}: ${esc(s.title)}" loading="lazy">
      <div class="body">
        <div class="head"><span class="no">${s.no}</span><h2>${esc(s.title)}</h2>
          <span class="kind${s.kind === "Abzweigung" ? " branch" : ""}">${esc(s.kind ?? "Hauptweg")}</span><span class="dev">${esc(s.device)}${s.screen ? " · " + esc(s.screen) : ""}</span></div>
        <div><p class="lbl">So geht's</p><p class="txt">${esc(s.do)}</p></div>
        <div><p class="lbl">Das siehst du</p><p class="txt">${esc(s.expect)}</p></div>
        ${s.why ? `<div class="why"><p class="lbl">Was dabei passiert</p><p class="txt">${esc(s.why)}</p></div>` : ""}
        ${s.stateAfter ? (() => { const d = stateDiff(s.stateBefore, s.stateAfter); return `<details class="ctx"><summary>Im Hintergrund: ${d.length ? d.length + (d.length === 1 ? " Änderung" : " Änderungen") : "nichts verändert"}</summary>${d.length ? `<ul>${d.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}</details>`; })() : ""}
        ${s.checks.length ? `<div class="checks">${s.checks.map(c => `<div><span class="dot ${c.ok ? "ok" : "bad"}"></span>${esc(c.desc)}${c.ok ? "" : " (fehlgeschlagen)"}</div>`).join("")}</div>` : ""}
        <div class="verdict" data-key="${key(ch.id, s)}" data-title="${esc(s.title)}" data-no="${s.no}"></div>
      </div></article>`).join("")}`;
  document.querySelectorAll(".shot").forEach(img => img.onclick = () => { $("#zoomImg").src = img.src; $("#zoom").showModal(); });
  renderVerdicts();
}

function renderVerdicts() {
  document.querySelectorAll(".verdict").forEach(el => {
    const k = el.dataset.key;
    const step = state.chapters[state.current]?.steps.find(x => x.no === +el.dataset.no);
    const v = step ? verdictOf(state.current, step) : { state: "offen" };
    const r = ["geaendert", "frage", "claude"].includes(v.state) ? {} : (v.r ?? {});
    el.closest(".step")?.classList.toggle("open", !DONE.includes(v.state));
    el.closest(".step")?.classList.toggle("asked", v.state === "frage");
    el.closest(".step")?.classList.toggle("changed", v.state === "geaendert");
    const draft = el.querySelector("textarea")?.value;
    const showNote = r.verdict === "no" || el.dataset.open === "1";
    el.innerHTML = `<button class="ok" aria-pressed="${r.verdict === "ok"}" ${state.canWrite && state.version === newest() ? "" : "disabled"}>Passt</button>
      <button class="bad" aria-pressed="${r.verdict === "no"}" ${state.canWrite && state.version === newest() ? "" : "disabled"}>Passt nicht</button>
      <span class="state">${v.state === "geaendert" ? "Seit der Bestätigung verändert: bitte gegenprüfen." + (v.why?.length ? " (" + esc(v.why.join("; ")) + ")" : "") : r.verdict ? "Gespeichert" : ""}</span>
      ${v.state === "claude" ? `<div class="cl ok">Von Claude geprüft: ${esc(v.r.reason ?? "")} Du kannst trotzdem selbst Passt oder Passt nicht wählen.</div>` : ""}
      ${v.state === "frage" ? `<div class="cl ask"><b>Frage an dich:</b> ${esc(v.r.question ?? "")}</div>` : ""}
      ${showNote ? `<textarea id="n-${k}" placeholder="Was passt nicht? (kurz)">${esc(draft ?? r.note ?? "")}</textarea>
        <button class="save">Notiz speichern</button>` : ""}`;
    const [ok, bad] = el.querySelectorAll("button.ok, button.bad");
    ok.onclick = () => { el.dataset.open = "0"; save(k, { verdict: "ok", note: "" }); };
    bad.onclick = () => { el.dataset.open = "1"; save(k, { verdict: "no", note: el.querySelector("textarea")?.value ?? r.note ?? "" }); };
    el.querySelector(".save")?.addEventListener("click", () => save(k, { verdict: "no", note: el.querySelector("textarea").value }));
  });
}

async function save(k, body) {
  if (!state.db) return;
  const ch = k.slice(0, k.indexOf("--"));
  const title = document.querySelector(`.verdict[data-key="${k}"]`)?.dataset.title ?? "";
  const no = +document.querySelector(`.verdict[data-key="${k}"]`)?.dataset.no;
  const step = state.chapters[state.current]?.steps.find(x => x.no === no) ?? {};
  const prints = { imgHash: step.imgHash ?? null, textHash: step.textHash ?? null, ctxHash: step.ctxHash ?? null,
    stateBefore: step.stateBefore ?? null, stateAfter: step.stateAfter ?? null };
  state.reviews[k] = { ...body, chapter: ch, title, by: "ernst", ...prints };
  renderVerdicts(); renderRail();
  try { await state.db.collection("reviews").doc(k).set({ ...body, chapter: ch, title, by: "ernst", version: state.version, ...prints, at: new Date().toISOString() }); }
  catch (e) { if (e?.code === "invalid_argument") { state.canWrite = false; render(); } }
}

function render() {
  renderRail();
  if (state.current === "finds") renderFinds();
  else if (state.current === "versions") renderVersions();
  else if (state.current === "coverage") renderCoverage();
  else if (state.current) renderChapter();
}
$("#zoom").onclick = () => $("#zoom").close();
load();
</script>
